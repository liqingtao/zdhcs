name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" Pillow PyAutoGUI pyinstaller
          python -m pip install "opencv-contrib-python==4.6.0.66"
          python -m pip install airtest pocoui
          python -m pip install --no-deps rapidocr_onnxruntime==1.4.4
          python -m pip install onnxruntime pyclipper shapely PyYAML tqdm six

      - name: Build exe
        run: pyinstaller --clean --noconfirm zdhcs.spec

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\zdhcs\* -DestinationPath dist\zdhcs-windows.zip

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: zdhcs-windows-portable
          path: dist\zdhcs-windows.zip

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc build\windows\installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: zdhcs-windows-setup
          path: dist\installer\zdhcs-setup.exe

